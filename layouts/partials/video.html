{{ if .Site.Params.homePageVideo }}
<style>
  @media screen and (min-width: 1023px) {
    .video-margin {
      /* Header reserves 148px of flow space above the absolutely-positioned,
         viewport-height video, so subtract it to land flush with its bottom. */
      margin-top: calc(100vh - 148px);
    }
  }
  .video-wrapper-lg-absolute {
    /* Baseline positioning context for the scrim/CTA children on all
       screen sizes; overridden to absolute (full-bleed) at desktop. */
    position: relative;
  }

  @media screen and (min-width: 1024px) {
    .video-wrapper-lg-absolute {
      position: absolute;
      width: 100vw;
    }
  }

  /* On mobile the CTAs sit at the top (out of thumb/safe-area territory at
     the bottom), so darken both ends of the video there; desktop keeps them
     at the bottom, so only that edge needs darkening to stay readable and
     fade into the page background below. */
  .hero-scrim {
    background: linear-gradient(
      to bottom,
      rgba(15, 23, 42, 0.75) 0%,
      transparent 22%,
      transparent 78%,
      rgba(15, 23, 42, 0.85) 100%
    );
  }

  @media screen and (min-width: 1024px) {
    .hero-scrim {
      background: linear-gradient(to top, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.35) 12%, transparent 28%);
    }
  }

  .hero-cta-primary {
    background-color: rgb(28, 138, 55);
  }

  .hero-cta-primary:hover {
    background-color: rgb(21, 107, 43);
  }

  .hero-cta-secondary {
    background-color: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.7);
  }

  .hero-cta-secondary:hover {
    background-color: rgba(255, 255, 255, 0.2);
  }

  /* Plain CSS, not Tailwind utility classes: this theme ships with a
     pre-compiled main.css bundle (see head.html: resources.Get
     "css/compiled/main.css") that Hugo copies as-is rather than rebuilding
     from our own template classes, so any utility class not already used
     somewhere inside the Blowfish theme itself (eg. an uncommon spacing
     value like pb-14) silently renders as nothing. */
  .hero-cta-row {
    position: absolute;
    inset-inline: 0;
    top: 0;
    bottom: auto;
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    padding-inline: 1rem;
    padding-top: 1.25rem;
  }

  @media screen and (min-width: 1024px) {
    .hero-cta-row {
      top: auto;
      bottom: 0;
      gap: 1rem;
      padding-inline: 0;
      padding-top: 0;
      padding-bottom: 1.5rem;
    }
  }

  .hero-cta-btn {
    padding: 0.4rem 0.85rem;
    font-size: 0.7rem;
  }

  @media screen and (min-width: 1024px) {
    .hero-cta-btn {
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
    }
  }
</style>
<div class="video-wrapper-lg-absolute inset-0 w-full h-screen">
    <video class="h-full mx-auto object-cover" autoplay loop muted>
        <source src="{{ .Site.Params.homePageVideo }}" data-src="{{ .Site.Params.homePageVideo }}" type="video/mp4" />
    </video>
    <div class="absolute inset-0 hero-scrim"></div>
    <div class="hero-cta-row">
        <a
            href="{{ "training" | relLangURL }}"
            class="hero-cta-primary hero-cta-btn rounded-full font-bold text-white shadow-lg transition-colors">
            Allenamenti
        </a>
        <a
            href="{{ "contatti" | relLangURL }}"
            class="hero-cta-secondary hero-cta-btn rounded-full font-bold text-white backdrop-blur transition-colors">
            Contatti
        </a>
    </div>
</div>
<div class="relative video-margin"></div>
{{ end }}
